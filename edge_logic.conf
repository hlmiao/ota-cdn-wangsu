# =============================================================================
# Wangsu CDN Pro - Edge Logic for OTA Firmware Distribution
# Pre-signed URL verification + S3 origin pull + edge cache
#
# URL format:
#   https://<domain>/<token_t>/<sign>/<mode><real_path>
#   token_t   = absolute expiry epoch seconds (now + ttl)
#   sign      = MD5 hex signature
#   mode      = f (file-level) | d (directory-level)
#   real_path = real object path, e.g. /firmware/v1.2.3/app.bin
#
# Signing algorithm (must match scripts/sign_url.py byte-for-byte):
#   file (f): sign = hex(md5(SECRET + real_path  + token_t))
#   dir  (d): sign = hex(md5(SECRET + parent_dir + token_t))
#
# NOTE: SECRET below is the DRILL key (matches scripts/sign_url.py DEFAULT_SECRET).
#       Replace it with your own secret before going to production, and update
#       both this config and the link-signing backend at the same time.
#
# NOTE: 'eval_func' is an advanced directive - confirm it is enabled on your
#       account, otherwise deployment will fail.
# =============================================================================

# 1) Verify signature + cache + origin pull (signed firmware requests)
location ~ ^/(\d+)/([a-f0-9]+)/([fd])(/.+)$ {
    set $token_t $1;
    set $token_sign $2;
    set $mode $3;
    set $real_path $4;

    # Extract parent directory (up to and including the last '/')
    set $parent_dir $real_path;
    if ($real_path ~ "^(.*/)[^/]+$") { set $parent_dir $1; }

    # File-level signature
    set $file_str "REPLACE_WITH_YOUR_SIGNING_SECRET${real_path}${token_t}";
    eval_func $file_md5_bin MD5 $file_str;
    eval_func $file_sign HEX_ENCODE $file_md5_bin;

    # Directory-level signature
    set $dir_str "REPLACE_WITH_YOUR_SIGNING_SECRET${parent_dir}${token_t}";
    eval_func $dir_md5_bin MD5 $dir_str;
    eval_func $dir_sign HEX_ENCODE $dir_md5_bin;

    # Validate signature by mode
    set $check_f "f${file_sign}";
    set $check_d "d${dir_sign}";
    set $expect "${mode}${token_sign}";
    set $auth "0";
    if ($check_f = $expect) { set $auth "1"; }
    if ($check_d = $expect) { set $auth "1"; }
    if ($auth = "0") { return 403; }

    # Validate expiration (token_t < now => expired => 403)
    if ($msec ~ "^(\d+)") { set $now $1; }
    eval_func $cmp COMPARE_INT $token_t $now;
    if ($cmp ~ "^-") { return 403; }

    # Cache firmware (serve mass downloads from edge without origin pull)
    proxy_cache_valid 200 206 24h;

    # Strip token prefix before origin pull
    rewrite ^/\d+/[a-f0-9]+/[fd](/.+)$ $1 break;
    origin_pass aws_origin;
}

# 2) Deny everything else (OTA allows signed access only)
location / { return 403; }
